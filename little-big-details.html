<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="UTF-8">
    <title>Little Big Details — Jenny Brooks</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A gallery of small interface details. Each one stays still until you hover.">
    <link href="https://api.fontshare.com/v2/css?f[]=switzer@400,500,600,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="stylesheets/stylesheet.css" media="screen">
    <script>document.documentElement.classList.add("js")</script>
    <script src="scripts/hover-gifs.js" defer onerror="document.documentElement.classList.remove('js')"></script>
  </head>
  <body>
    <main class="card article gallery">
      <p class="article-back"><a href="/"><svg class="article-back-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M10 3L5 8L10 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>Homepage</a></p>
      <header class="intro">
        <h1>Little Big Details</h1>
        <p class="subtitle">Tiny interactions that make a product feel finished.</p>
      </header>

      <p class="gallery-hint">Hover to play.</p>
      <div class="detail-grid">
        <figure class="detail">
          <img class="hover-gif" src="images/little-big-details/teachers-in-the-curriculum.gif" alt="Where are teachers in the curriculum?">
          <figcaption>Where are teachers in the curriculum?</figcaption>
        </figure>
        <figure class="detail">
          <img class="hover-gif" src="images/little-big-details/standard-form.gif" alt="Standard form">
          <figcaption>Standard form</figcaption>
        </figure>
        <figure class="detail">
          <img class="hover-gif" src="images/little-big-details/desmos-math-curriculum.gif" alt="Desmos Math Curriculum">
          <figcaption>Desmos Math Curriculum</figcaption>
        </figure>
      </div>

      <footer class="footer">
        <p>Big fan of accessibility, snacks, <a href="/little-big-details.html">little big details</a>, and mountain sports.</p>
        <p>🖃 hijennybrooks@gmail.com</p>
        <p class="footer-credit">I wrote most of the code for this site with some speed boosts from Cursor.</p>
      </footer>
    </main>
  </body>
</html>
